<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل العمرة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f3ea;--card:#fffdf7;--ink:#17302a;--mute:#5d716b;--g:#0f6b52;--g2:#17a37a;--gold:#b98a2e;--line:#e4dcc6;--sh:0 8px 24px rgba(15,60,45,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a16;--card:#13271f;--ink:#eef3ee;--mute:#9db3aa;--g:#2bbf92;--g2:#1c8f6c;--gold:#e0b45a;--line:#244035;--sh:0 8px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0c1a16;--card:#13271f;--ink:#eef3ee;--mute:#9db3aa;--g:#2bbf92;--g2:#1c8f6c;--gold:#e0b45a;--line:#244035;--sh:0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;line-height:1.8;max-width:560px;margin:auto;padding-bottom:40px}
header{background:linear-gradient(160deg,#0b4f3d,#138f6b);color:#fff;padding:28px 20px 56px;border-radius:0 0 32px 32px;text-align:center;position:relative}
header h1{font-family:Amiri,serif;font-size:32px}
header p{opacity:.85;font-size:14px}
.top{position:absolute;top:12px;inset-inline:14px;display:flex;justify-content:space-between}
.top button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:20px;padding:4px 12px;font:inherit;font-size:13px}
.prog{margin:-30px 16px 14px;background:var(--card);border-radius:18px;padding:12px 16px;box-shadow:var(--sh)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g2),var(--gold));transition:width .4s}
.map{margin:0 16px;background:var(--card);border-radius:22px;padding:8px;box-shadow:var(--sh)}
.map svg{width:100%;height:auto;display:block}
.hint{text-align:center;color:var(--mute);font-size:13px;margin:8px 0}
.node{cursor:pointer}
.node circle.c{fill:var(--g);stroke:var(--card);stroke-width:3;transition:.2s}
.node.done circle.c{fill:var(--gold)}
.node:hover circle.c{transform-box:fill-box;transform-origin:center;transform:scale(1.12)}
.node text{font-family:Tajawal,sans-serif}
.lbl{fill:var(--ink);font-size:13px;font-weight:700;text-anchor:middle}
.num{fill:#fff;font-size:14px;font-weight:700;text-anchor:middle}
.list{margin:14px 16px 0;display:grid;gap:8px}
.list button{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font:inherit;color:var(--ink);text-align:start;cursor:pointer}
.list b{width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.list button.done b{background:var(--gold)}
.list small{display:block;color:var(--mute);font-size:12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;margin:auto;max-width:560px;height:82vh;background:var(--card);border-radius:26px 26px 0 0;transform:translateY(105%);transition:.35s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column;box-shadow:var(--sh)}
.sheet.on{transform:none}
.sh-h{padding:16px 20px 8px;border-bottom:1px solid var(--line)}
.sh-h h2{font-family:Amiri,serif;font-size:26px;color:var(--g)}
.sh-h p{color:var(--mute);font-size:14px}
.x{position:absolute;top:12px;inset-inline-start:14px;border:0;background:var(--line);color:var(--ink);width:32px;height:32px;border-radius:50%;font-size:16px}
.tabs{display:flex;gap:6px;padding:10px 14px;overflow-x:auto}
.tabs button{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:20px;padding:4px 14px;font:inherit;font-size:14px}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.body{flex:1;overflow-y:auto;padding:4px 16px 12px}
.item{background:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:10px;border-inline-start:4px solid var(--gold)}
.item h4{font-size:15px;color:var(--g);margin-bottom:2px}
.item p{font-size:15px}
.dua{font-family:Amiri,serif;font-size:21px;line-height:2.1;border-inline-start-color:var(--g)}
.dua h4{font-family:Tajawal,sans-serif}
.tag{display:inline-block;font-size:11px;background:var(--gold);color:#fff;border-radius:8px;padding:0 8px;margin-inline-start:6px}
.foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.foot button{flex:1;border:0;border-radius:14px;padding:10px;font:inherit;font-weight:700;background:var(--line);color:var(--ink)}
.foot .ok{background:var(--g);color:#fff;flex:1.6}
.note{text-align:center;color:var(--mute);font-size:12px;margin:18px 20px 0}
</style>
</head>
<body>
<header>
  <div class="top"><button id="th">الوضع</button><button id="rs">إعادة</button></div>
  <h1>دليل العمرة</h1>
  <p>اضغط على أي موضع لتعرف فرائضه وسننه وأدعيته</p>
</header>
<div class="prog"><div style="display:flex;justify-content:space-between;font-size:14px"><span>تقدّمك في العمرة</span><b id="pc">0 / 7</b></div><div class="bar"><i id="pb"></i></div></div>
<div class="map"><svg id="svg" viewBox="0 0 360 700" role="img" aria-label="خريطة مناسك العمرة"></svg></div>
<p class="hint">أو اختر من القائمة بالترتيب</p>
<div class="list" id="list"></div>
<p class="note">للاسترشاد والتعلّم. عند الاختلاف بين المذاهب أو الحاجة لفتوى، راجع عالمًا أو مرشد الحملة.</p>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sh-h"><button class="x" id="cl" aria-label="إغلاق">✕</button><h2 id="st"></h2><p id="ss"></p></div>
  <div class="tabs" id="tabs"></div>
  <div class="body" id="bd"></div>
  <div class="foot"><button id="pv">السابق</button><button class="ok" id="ok">تم ✓</button><button id="nx">التالي</button></div>
</div>
<script>
const S=[
{n:'الميقات والإحرام',s:'الخطوة الأولى — نية الدخول في النسك',x:60,y:60,
 f:[['الإحرام: نية الدخول في العمرة','تنوي بقلبك الدخول في العمرة عند الميقات أو محاذاته، ولا يجوز تجاوز الميقات لمن أراد النسك بلا إحرام.','ركن'],
 ['الإحرام من الميقات','ذو الحليفة (أبيار علي) لأهل المدينة · الجحفة (قرب رابغ) لأهل الشام ومصر والمغرب · قرن المنازل (السيل الكبير) لأهل نجد · يلملم لأهل اليمن · ذات عرق لأهل العراق. ومن كان داخل المواقيت أحرم من مكانه، والمقيم في مكة يخرج إلى الحل (كالتنعيم) ليحرم بالعمرة.','واجب'],
 ['اجتناب محظورات الإحرام','للجميع: حلق الشعر وقص الأظافر، الطيب في البدن والثوب، الجماع ومقدماته، عقد النكاح وخطبته، قتل الصيد، والرفث والفسوق والجدال. وللرجل: لبس المخيط (القميص والسراويل) وتغطية الرأس بملاصق. وللمرأة: النقاب والقفازان، وتستر وجهها بغيرهما أمام الأجانب. ومن ارتكب محظورًا لزمته فدية بحسب الحال، فيسأل أهل العلم.','واجب']],
 s:[['الاغتسال والتنظف','قص الشارب والأظافر وإزالة الشعر الزائد قبل الإحرام، ثم الغسل كغسل الجنابة.'],
 ['التطيّب في البدن','في الرأس واللحية قبل النية فقط، ولا يطيّب ثوب الإحرام، ولا يضر بقاء أثره بعد النية.'],
 ['لباس الرجل','إزار ورداء أبيضان نظيفان ونعلان. وللمرأة أي لباس ساتر غير متبرج.'],
 ['الإحرام عقب صلاة','بعد فريضة، أو بعد ركعتين بنية سنة الوضوء، ثم النية والتلبية.'],
 ['رفع الصوت بالتلبية','للرجل، وتُسمع المرأة نفسها فقط.'],
 ['الإكثار من التلبية','حتى تصل إلى البيت، وتقطعها عند بدء الطواف.']],
 d:[['صيغة نية الإحرام بالعمرة','لَبَّيْكَ اللَّهُمَّ عُمْرَةً — ويجوز: لَبَّيْكَ اللَّهُمَّ بِعُمْرَةٍ. والنية محلها القلب، والتلفظ بها سنة.'],
 ['دعاء يجوز قوله بعد النية','اللَّهُمَّ إِنِّي أُرِيدُ العُمْرَةَ فَيَسِّرْهَا لِي وَتَقَبَّلْهَا مِنِّي. وليس قوله لازمًا.'],
 ['الاشتراط لمن خاف عائقًا كمرض','فَإِنْ حَبَسَنِي حَابِسٌ فَمَحِلِّي حَيْثُ حَبَسْتَنِي — أو: اللَّهُمَّ مَحِلِّي حَيْثُ حَبَسْتَنِي'],

 ['بعد التلبية','صلِّ على النبي صلى الله عليه وسلم، واسأل الله رضوانه والجنة، واستعذ به من النار.']],
 t:['في الطائرة: البس ثوب الإحرام قبل الإقلاع، وانوِ عند محاذاة الميقات وقبل تجاوزه.','لا تؤخر النية حتى تتجاوز الميقات؛ فتلزمك فدية.']},
{n:'دخول المسجد الحرام ورؤية الكعبة',s:'ادخل بطهارة وخشوع',x:55,y:165,
 f:[['الطهارة','تتوضأ قبل الطواف، فالوضوء شرط للطواف عند الجمهور.','شرط'],['الاستعداد للطواف','ستر العورة، وإنهاء التلبية عند بدء الطواف.','']],
 s:[['الغسل لدخول مكة','يُستحب إن تيسر.'],['الدخول بالرِّجل اليمنى','مع الخشوع والسكينة.'],['لا تُصلِّ تحية المسجد','فتحية المسجد الحرام هي الطواف.'],['التوجه إلى الحجر الأسود','لتبدأ الطواف منه.'],['الدعاء عند رؤية الكعبة','موطن إجابة، فادعُ بما شئت من خيري الدنيا والآخرة.']],
 d:[['دعاء دخول المسجد','بِسْمِ اللهِ، وَالصَّلَاةُ وَالسَّلَامُ عَلَى رَسُولِ اللهِ، اللَّهُمَّ اغْفِرْ لِي ذُنُوبِي وَافْتَحْ لِي أَبْوَابَ رَحْمَتِكَ'],

 ['دعاء رُوي ولا يصح مرفوعًا','اللَّهُمَّ زِدْ هَذَا البَيْتَ تَشْرِيفًا وَتَعْظِيمًا وَتَكْرِيمًا وَمَهَابَةً، وَزِدْ مَنْ شَرَّفَهُ وَكَرَّمَهُ مِمَّنْ حَجَّهُ أَوِ اعْتَمَرَهُ تَشْرِيفًا وَتَكْرِيمًا وَتَعْظِيمًا وَبِرًّا']],
 t:['لا تُلزم نفسك بصيغة؛ اسأل ربك حاجاتك بلغتك.','لا تقف طويلًا في المطاف فتعطّل الناس.']},
{n:'الكعبة المشرفة — الطواف',s:'الركن الثاني — سبعة أشواط حول البيت',x:180,y:215,k:1,
 f:[['سبعة أشواط','يبدأ من الحجر الأسود وينتهي إليه، وكل دورة كاملة شوط.','ركن'],
 ['الكعبة عن اليسار','وخارج الحِجر (حجر إسماعيل)، فمن دخله لم يُحسب ذلك الشوط.','شرط'],
 ['الطهارة وستر العورة','الوضوء عند الجمهور؛ ومن أحدث أثناءه توضأ وأكمل. والحائض لا تطوف حتى تطهر، وتسأل أهل العلم.','شرط'],
 ['الموالاة وإكمال العدد','أشواط متتابعة بلا فاصل طويل، ولا ينقص عن سبعة، وإن شككت أخذت بالأقل.','واجب'],
 ['أن يكون داخل المسجد','في المطاف أو الأروقة أو الأدوار العليا، بحيث يحيط بالبيت.','شرط']],
 s:[['الاضطباع للرجل','جعل وسط الرداء تحت الإبط الأيمن وطرفيه على المنكب الأيسر، في كل أشواط طواف العمرة.'],
 ['الرَّمَل للرجل','الإسراع مع تقارب الخطى في الأشواط الثلاثة الأولى، والمشي في الأربعة الباقية.'],
 ['استلام الحجر الأسود','باليد اليمنى وتقبيله إن تيسر بلا أذى، وإلا أشار إليه بيده اليمنى وكبّر دون تقبيل اليد.'],
 ['استلام الركن اليماني','باليد اليمنى دون تقبيل، فإن لم يتيسر مضى بلا إشارة ولا تكبير.'],
 ['الإكثار من الذكر والدعاء وقراءة القرآن','بلا صيغة ملزمة لكل شوط، وبلا رفع صوت يؤذي غيرك.'],
 ['السكينة والأدب','الدنو من البيت ما لم يؤذِ أحدًا.']],
 d:[['عند محاذاة الحجر الأسود في كل شوط','بِسْمِ اللهِ وَاللهُ أَكْبَرُ'],
 ['بين الركن اليماني والحجر الأسود','رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ'],
 ['ذكر مناسب','سُبْحَانَ اللهِ وَالحَمْدُ لِلَّهِ وَلَا إِلَهَ إِلَّا اللهُ وَاللهُ أَكْبَرُ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ'],
 ['دعاء إبراهيم وإسماعيل','رَبَّنَا تَقَبَّلْ مِنَّا إِنَّكَ أَنتَ السَّمِيعُ العَلِيمُ'],
 ['دعاء جامع','اللَّهُمَّ إِنِّي أَسْأَلُكَ العَفْوَ وَالعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي'],

 t:['إن أُقيمت الصلاة فصلِّ ثم أكمل من حيث انتهيت.','استعن بعدّاد لضبط الأشواط.','لا تُقبّل ولا تمسح من البيت إلا الحجر الأسود، ولا تمسح الركن اليماني بنية التبرك بغير الاستلام.']},
{n:'مقام إبراهيم — ركعتا الطواف',s:'بعد الأشواط السبعة',x:275,y:300,
 f:[['ركعتان بعد الطواف','سنة مؤكدة عند الجمهور، وواجبتان عند الحنفية.','سنة مؤكدة']],
 s:[['تسوية الرداء','يُغطّي الرجل منكبيه قبل الصلاة، فينتهي الاضطباع.'],
 ['القراءة','بعد الفاتحة: الكافرون في الأولى، والإخلاص في الثانية.'],
 ['مكان الصلاة','خلف المقام إن تيسر بلا أذى، وإلا في أي موضع من المسجد.'],
 ['الملتزم','الموضع بين الحجر الأسود وباب الكعبة، يجوز الدعاء عنده إن تيسر بلا إيذاء.'],

 ['في الركعتين','﴿قُلْ يَا أَيُّهَا الْكَافِرُونَ﴾ في الأولى، و﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾ في الثانية'],
 ['بعد الصلاة','استغفر ثلاثًا، واذكر الله، وادعُ لنفسك ولوالديك وللمسلمين.']],
 t:['إن زُحمتَ فصلِّ في أي مكان بالمسجد.']},
{n:'زمزم',s:'الشرب من ماء زمزم',x:85,y:320,
 f:[],

 d:[['عند الشرب','بِسْمِ اللهِ'],['الدعاء بعد الشرب','اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا وَاسِعًا، وَشِفَاءً مِنْ كُلِّ دَاءٍ. والأمر في الدعاء واسع، فاسأل ما شئت.']],
 t:['ثم اتجه إلى الصفا للسعي.']},
{n:'الصفا — بداية السعي',s:'الركن الثالث — يبدأ السعي من هنا',x:75,y:430,
